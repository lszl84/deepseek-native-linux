name: Release

# Push a tag like v0.1.0 (matching VERSION in the Makefile and pkgver in
# packaging/arch/PKGBUILD) to build the Arch and Debian packages and attach
# them to the GitHub release for that tag (created if it does not exist).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build packages for, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Check version
        run: |
          makever=$(sed -n 's/^VERSION *:= *//p' Makefile)
          pkgver=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          if [ "v$makever" != "$TAG" ] || [ "$pkgver" != "$makever" ]; then
            echo "Tag $TAG, Makefile $makever and PKGBUILD $pkgver must all match" >&2
            exit 1
          fi

  arch:
    needs: version
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Build package
        run: |
          pacman -Syu --noconfirm --needed gtk3 curl json-glib libsecret
          useradd -m builder
          chown -R builder .
          cd packaging/arch
          su builder -c "makepkg --nodeps --noconfirm"
      - uses: actions/upload-artifact@v5
        with:
          name: arch
          path: packaging/arch/*.pkg.tar.zst

  deb:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Build package
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev libgtk-3-dev libcurl4-openssl-dev libjson-glib-dev libsecret-1-dev
          packaging/deb/build-deb.sh
          dpkg-deb --info ./*.deb
      - uses: actions/upload-artifact@v5
        with:
          name: deb
          path: ./*.deb

  test-deb:
    needs: deb
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: deb
      - name: Install and run
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./*.deb
          deepseek-native --version
          test -f /usr/share/applications/io.github.lszl84.DeepSeekNative.desktop

  publish:
    needs: [arch, test-deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
